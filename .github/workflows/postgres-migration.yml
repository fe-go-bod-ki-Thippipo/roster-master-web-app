name: PostgreSQL migration Step 0
on:
  push:
    branches: [feature/002a-1-employee-lifecycle]
  pull_request:
    paths:
      - 'database/migrations/**'
      - 'database/tests/**'
      - '.github/workflows/postgres-migration.yml'
  workflow_dispatch:
jobs:
  migration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['15', '16']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGPASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
      - name: Provision non-superuser migration role and owned test database
        env:
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE roster_migrator LOGIN PASSWORD 'test-only-password' NOSUPERUSER NOCREATEDB NOCREATEROLE"
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE roster_test OWNER roster_migrator"
      - name: Apply migrations and record immutable checksums
        env:
          PGUSER: roster_migrator
          PGDATABASE: roster_test
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f database/tests/000_migration_ledger.sql
          for spec in "001:database/migrations/001_schema.sql" "002a-1:database/migrations/002a_1_employee_lifecycle.sql"; do
            version="${spec%%:*}"
            path="${spec#*:}"
            checksum="$(sha256sum "$path" | cut -d' ' -f1)"
            existing="$(psql -v ON_ERROR_STOP=1 -Atc "SELECT checksum_sha256 FROM public.schema_migration_ledger WHERE version = '$version'")"
            if [ -n "$existing" ]; then
              echo "Migration $version already recorded; refusing replay" >&2
              exit 1
            fi
            psql -v ON_ERROR_STOP=1 -f "$path"
            psql -v ON_ERROR_STOP=1 -c "INSERT INTO public.schema_migration_ledger(version,checksum_sha256) VALUES ('$version','$checksum')"
          done
          psql -v ON_ERROR_STOP=1 -Atc "SELECT count(*) = 2 FROM public.schema_migration_ledger" | grep -qx t
      - name: Run catalog and negative regression probes
        env:
          PGUSER: roster_migrator
          PGDATABASE: roster_test
        run: psql -v ON_ERROR_STOP=1 -f database/tests/002a_1_step0.sql
      - name: Assert migration replay is blocked by ledger
        env:
          PGUSER: roster_migrator
          PGDATABASE: roster_test
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -Atc "SELECT checksum_sha256 = '$(sha256sum database/migrations/001_schema.sql | cut -d' ' -f1)' FROM public.schema_migration_ledger WHERE version='001'" | grep -qx t
          psql -v ON_ERROR_STOP=1 -Atc "SELECT checksum_sha256 = '$(sha256sum database/migrations/002a_1_employee_lifecycle.sql | cut -d' ' -f1)' FROM public.schema_migration_ledger WHERE version='002a-1'" | grep -qx t
          test "$(psql -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM public.schema_migration_ledger WHERE version='001'")" = 1
